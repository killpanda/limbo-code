# Packaging only: `pip install limbo-code` installs the Rust `limbo` binary.
# maturin builds the crate and puts the binary in a platform wheel; there is
# no Python code in the package. The version comes from Cargo.toml.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "limbo-code"
description = "A minimal terminal AI coding agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/killpanda/limbo-code"

[tool.maturin]
bindings = "bin"
strip = true
