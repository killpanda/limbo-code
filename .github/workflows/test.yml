name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # grep hard-depends on ripgrep (no Python fallback since LIM-24).
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      # Install from uv.lock so CI renders snapshots with the exact same
      # textual/rich/syrupy versions the baselines were generated with.
      # Dev tools (pytest/ruff/mypy) are a PEP 735 dependency group and are
      # installed by default — no --extra flag.
      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest -v

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src
