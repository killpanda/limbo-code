[package]
name = "limbo"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
description = "A terminal AI coding agent"
license = "MIT"

[[bin]]
name = "limbo"
path = "src/main.rs"

[dependencies]
# async runtime + utilities
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
# HTTP + serialization
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
toml_edit = "0.23"
# CLI + errors
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tachyonfx = "0.25"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
# tools
similar = "2"
globset = "0.4"
ignore = "0.4"
base64 = "0.22"
bytes = "1"
libc = "0.2"
# misc
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
rand = "0.9"
regex = "1"
include_dir = "0.7"
sha1_smol = "1"
url = "2"
# chat gateway (WeChat iLink media: AES-128-ECB + MD5; terminal QR code for login)
aes = "0.8"
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
